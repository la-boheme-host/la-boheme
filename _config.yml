# =========================================================
# laboheme-blog 사이트 기본 정보
# =========================================================
title: "La Bohème Blog"               # 블로그 상단에 노출될 블로그 이름
email: "la.boheme.host@gmail.com"      # 본인 이메일 주소
description: >-                      # 검색엔진(구글 등)에 노출될 블로그 소개글
  티스토리에서 이전한 깃허브 블로그입니다.


# =========================================================
# GitHub Pages URL 및 스킨 CSS 경로 설정 (핵심 수정 부분)
# =========================================================
url: "https://la-boheme-host.github.io"   # 본인의 GitHub Pages 메인 도메인
baseurl: "/la-boheme"                     # Repository 이름을 하위 경로로 입력 (앞에 / 필수)


# 프로필 정보 (Chirpy 테마 좌측 사이드바용)
author:
  name: "La Bohème"
  avatar: "/assets/images/avatar.jpg"
  bio: "티스토리 블로그 이전 마이그레이션 진행 중"

# =========================================================
# 티스토리 숫자 URL 보존 설정
# =========================================================
permalink: /:title/

# =========================================================
# 구글 애드센스 연동 설정
# =========================================================
google_adsense:
  enable: true
  client_id: "pub-8868289380135841" # 본인의 구글 애드센스 게시자 ID

# =========================================================
# 빌드 및 플러그인 설정
# =========================================================
theme: jekyll-theme-chirpy         # 치르피 테마

# 언어 및 시간대 설정
lang: ko-KR
timezone: Asia/Seoul

# 플러그인 및 빌드 설정
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor 
  
# 미래 날짜로 작성된 게시글도 메인 목록에 즉시 노출하도록 설정
future: true